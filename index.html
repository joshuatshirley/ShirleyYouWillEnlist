<body>
<div id="app"></div>
<!-- Question/scoring data lives in question-data.js, not inline here --
     it's ~85KB of generated content nobody hand-edits, so splitting it
     out keeps this file to markup, styles, and app logic. See that
     file's own header for how it's regenerated. -->
<script src="./question-data.js"></script>
<script src="./assets/qrcode.js"></script>
<script src="./local-bank/practice-data.js"></script>
<!-- Extra test-taking tips, same local-only arrangement. -->
<script src="./local-bank/tips-data.js"></script>
<script>
(function () {
  "use strict";

  var app = document.getElementById("app");
  var TEST_VARIANTS = null; // array of {sections: [...]} -- one per test number
  var QUESTIONS = null;     // the currently-selected variant; reassigned when Start Test is clicked
  var SCORING = null;       // shared across all variants -- same norm tables regardless of content

  // Per-station values live in window.EST_CONFIG, set in a <script> near
  // the top of <head> -- see the comment there for what to edit when
  // handing this kiosk off to a different station.
  var CONFIG = window.EST_CONFIG;
  // Optional local-only practice bank; null on the public deployment.
  var PRACTICE = window.__EST_PRACTICE__ || null;

  function formatStationAddress(addr) {
    if (!addr) return null;
    if (typeof addr === "string") {
      var parts = addr.split(",").map(function (s) { return s.trim(); });
      if (parts.length >= 3) {
        var stateZip = parts[parts.length - 1].split(/\s+/);
        var state = stateZip[0] || "";
        var zip = stateZip.slice(1).join(" ") || "";
        var city = parts[parts.length - 2];
        var street = parts.slice(0, parts.length - 2).join(", ");
        return { street: street, city: city, state: state, zip: zip, text: addr };
      }
      return { street: addr, city: "", state: "", zip: "", text: addr };
    }
    var street = addr.street || "";
    var city = addr.city || "";
    var state = addr.state || "";
    var zip = addr.zip || "";
    var cityStateZip = (city + (city && state ? ", " : "") + state + (zip ? " " + zip : "")).trim();
    var text = [street, cityStateZip].filter(Boolean).join(", ");
    return { street: street, city: city, state: state, zip: zip, text: text };
  }

  // Plain strings (older configs) still work: they become names with no phone.
  var RECRUITERS = CONFIG.recruiters.map(function (r) {
    if (typeof r === "string") {
      return { name: r, phone: "", email: "", hiHelloUrl: "", address: CONFIG.stationAddress || null };
    }
    return {
      name: r.name || "",
      phone: r.phone || "",
      email: r.email || "",
      hiHelloUrl: r.hiHelloUrl || "",
      address: r.address || CONFIG.stationAddress || null
    };
  });
  function recruiterInfo(name) {
    if (name) {
      for (var i = 0; i < RECRUITERS.length; i++) if (RECRUITERS[i].name === name) return RECRUITERS[i];
    }
    for (var j = 0; j < RECRUITERS.length; j++) if (/Shirley/i.test(RECRUITERS[j].name)) return RECRUITERS[j];
    return RECRUITERS[0] || { name: name || "", phone: "", email: "", hiHelloUrl: "", address: CONFIG.stationAddress || null };
  }

  var SCORES_ACCESS_LAST = CONFIG.scoresAccessLastName;
  var SCORES_ACCESS_FIRST = CONFIG.scoresAccessFirstName;

  // Best-effort sync on top of the local cookie history, which stays the
  // durable record if this is empty or the device is offline.
  var RESULTS_WEBHOOK_URL = CONFIG.resultsWebhookUrl;

  var M2S_SIGNUP_URL = CONFIG.m2sSignupUrl;

  // Keyboard shortcuts on the question screen only: A-D/1-4 pick an answer,
  // Enter advances. Exactly one handler is ever attached -- each screen
  // render swaps it out (or clears it) so key presses never leak to a
  // screen they weren't meant for.
  var activeKeyHandler = null;
  function setKeyHandler(fn) {
    if (activeKeyHandler) document.removeEventListener("keydown", activeKeyHandler);
    activeKeyHandler = fn;
    if (fn) document.addEventListener("keydown", fn);
  }

  // Auto-reset to the Start screen after CONFIG.idleTimeoutMinutes of
  // inactivity, but only once results are already in (the final STOP
  // screen and Results screen) -- never mid-test, since a mid-test reset
  // would silently discard a test-taker's in-progress answers. This is a
  // kiosk left unattended after a completed test, not a distraction-mid-
  // question guard (the per-section timer already forces progress there).
  // Practice screens pass a shorter limit (see PRACTICE_IDENTITY_TTL_MS).
  var IDLE_TIMEOUT_MS = CONFIG.idleTimeoutMinutes * 60 * 1000;
  var idleTimeoutHandle = null;
  var idleTimeoutArmed = false;
  var idleTimeoutMs = IDLE_TIMEOUT_MS;

  // An idle reset means the kiosk was walked away from, so it also drops
  // the remembered practice name/phone before the next person walks up.
  // A test-taker who walked off mid-way through the readiness questions
  // still gets their result sent, with whatever they'd answered.
  function resetIdleTimeout() {
    if (idleTimeoutHandle) clearTimeout(idleTimeoutHandle);
    idleTimeoutHandle = setTimeout(function () {
      postFinalResult();
      lastPracticeIdentity = null;
      renderStart();
    }, idleTimeoutMs);
  }

  function armIdleTimeout(ms) {
    idleTimeoutMs = ms || IDLE_TIMEOUT_MS;
    if (!idleTimeoutArmed) {
      idleTimeoutArmed = true;
      document.addEventListener("click", resetIdleTimeout);
      document.addEventListener("touchstart", resetIdleTimeout);
      document.addEventListener("keydown", resetIdleTimeout);
    }
    resetIdleTimeout();
  }

  function disarmIdleTimeout() {
    if (idleTimeoutHandle) { clearTimeout(idleTimeoutHandle); idleTimeoutHandle = null; }
    if (idleTimeoutArmed) {
      idleTimeoutArmed = false;
      document.removeEventListener("click", resetIdleTimeout);
      document.removeEventListener("touchstart", resetIdleTimeout);
      document.removeEventListener("keydown", resetIdleTimeout);
    }
  }

  var state = {
    lastName: "",
    firstName: "",
    phone: "",
    recruiter: "",
    testNumber: 1,
    sectionIndex: 0,  // index into QUESTIONS.sections
    questionIndex: 0, // index into the current section's questions
    answers: {},      // answers[sectionCode][n] = "A"/"B"/"C"/"D"
    timerHandle: null,
    secondsLeft: 0,
    finalResults: null, // set once the last section ends; see renderStop/renderResults
    finalPayload: null, // buildResultPayload(finalResults), sent to the webhook and reused by renderResults
    survey: null,       // end-of-test readiness answers; see renderReadiness
    resultPosted: false // finalPayload sent (postFinalResult), so it's never sent twice
  };

  function emptySurvey() {
    return { ready: null, reasons: [], other: "", makeTen: "" };
  }

  function el(tag, attrs, children) {
    var e = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (typeof c === "string") e.appendChild(document.createTextNode(c));
      else if (c) e.appendChild(c);
    });
    return e;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }

  function fmtTime(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  // "PART I - (WK) WORD KNOWLEDGE" -> { part: "PART I", name: "Word Knowledge" }
  function parseSectionTitle(title) {
    var m = title.match(/^(PART [IVX]+) - \([A-Z]+\)\s*(.+)$/);
    if (!m) return { part: title, name: title };
    var name = m[2].replace(/\S+/g, function (w) {
      return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
    });
    return { part: m[1], name: name };
  }

  // "Word Knowledge" -> fragment with the leading letter of each word bolded,
  // so the section's acronym (e.g. WK) reads visually without spelling it out.
  function boldedName(name) {
    var frag = document.createDocumentFragment();
    name.split(" ").forEach(function (word, i) {
      if (i > 0) frag.appendChild(document.createTextNode(" "));
      frag.appendChild(el("strong", {}, [word.charAt(0)]));
      frag.appendChild(document.createTextNode(word.slice(1)));
    });
    return frag;
  }

  // RECRUITERS is stored "Lastname RANK" (alphabetizes cleanly by surname in
  // the dropdown); results display it rank-first, e.g. "Shirley SFC" -> "SFC
  // Shirley". Only reformats when the last word is written in ALL CAPS --
  // matching every rank abbreviation used in this app (SSG, SFC, 1SG, ...)
  // -- so a multi-word value that ISN'T "Lastname RANK", like a station
  // name ("Myrtle Beach") on a deployment shared across stations, passes
  // through unchanged instead of getting flipped into "Beach Myrtle".
  function formatRecruiterDisplay(value) {
    if (!value) return value;
    var parts = value.trim().split(/\s+/);
    if (parts.length < 2) return value;
    var rank = parts[parts.length - 1];
    if (rank !== rank.toUpperCase() || !/[A-Z]/.test(rank)) return value;
    var name = parts.slice(0, -1).join(" ");
    return rank + " " + name;
  }

  // First+Last stored separately (state.lastName/state.firstName) so the
  // Sheet/cookie history can sort and group by last name -- this is just
  // the "First Last" form used for on-screen greetings.
  function displayName() {
    return (state.firstName + " " + state.lastName).trim();
  }

  // ---------- Data loading ----------
  // Practice-test content and scoring tables come from question-data.js
  // (loaded via a plain <script src>, not fetch() -- see that file's own
  // header comment for why) and are already on window.__EST_STANDALONE__
  // by the time this runs, since that script tag sits above this one.
  function loadData(cb) {
    TEST_VARIANTS = window.__EST_STANDALONE__.testVariants;
    QUESTIONS = TEST_VARIANTS[0]; // Test 1 by default; re-picked in the startBtn handler
    SCORING = window.__EST_STANDALONE__.scoring;
    cb();
  }

  // ---------- Screen: Start ----------
  function renderStart() {
    clear(app);
    setKeyHandler(null);
    disarmIdleTimeout();
    app.appendChild(el("div", { class: "brand-bar" }, [
      el("img", { src: "./assets/army_logo_horiz.svg", alt: "U.S. Army" })
    ]));
    var card = el("div", { class: "card" });
    card.appendChild(el("h1", {}, ["PRACTICE ASVAB"]));
    card.appendChild(el("h2", { class: "subtitle" }, ["Practice test for the Armed Services Vocational Aptitude Battery"]));
    card.appendChild(el("div", { class: "instructions-box" }, [
      "The following test which you are about to take is a practice test for the Armed Services Vocational Aptitude " +
      "Battery (ASVAB). This practice test is a tool designed to gauge where your current academic capabilities are " +
      "at by using four testing categories. Each category has a set number of questions and a set amount of allotted " +
      "time in which to complete the section."
    ]));

    var sectionList = el("div", { class: "section-list" });
    QUESTIONS.sections.forEach(function (sec) {
      var parsed = parseSectionTitle(sec.title);
      sectionList.appendChild(el("div", { class: "section-item" }, [
        el("div", { class: "section-item-name" }, [boldedName(parsed.name)]),
        el("div", { class: "section-item-meta" }, [
          sec.questions.length + " questions  ·  " + sec.minutes + " minutes"
        ])
      ]));
    });
    card.appendChild(sectionList);

    card.appendChild(el("div", { class: "instructions-box" }, [
      "Take all instruction from your recruiter. Scratch paper should be available for any math functions " +
      "you need to complete for this test. Good luck!"
    ]));

    card.appendChild(el("label", { class: "field-label" }, ["Last Name: *"]));
    var lastNameInput = el("input", { type: "text", id: "lastName", placeholder: "Last name", required: "required" });
    card.appendChild(lastNameInput);
    var lastNameError = el("div", { class: "field-error" }, ["Last name is required."]);
    card.appendChild(lastNameError);

    card.appendChild(el("label", { class: "field-label" }, ["First Name:"]));
    var firstNameInput = el("input", { type: "text", id: "firstName", placeholder: "First name" });
    card.appendChild(firstNameInput);

    card.appendChild(el("label", { class: "field-label" }, ["Phone Number: *"]));
    var phoneInput = el("input", { type: "tel", id: "phone", placeholder: "(XXX) XXX-XXXX" });
    card.appendChild(phoneInput);
    var phoneError = el("div", { class: "field-error" }, ["A valid 10-digit phone number is required."]);
    card.appendChild(phoneError);

    phoneInput.addEventListener("blur", function () {
      var d = phoneDigits(phoneInput.value);
      if (d.length === 10) phoneInput.value = formatPhone(d);
    });
    phoneInput.addEventListener("input", function () {
      var d = phoneDigits(phoneInput.value);
      if (d.length === 10) {
        phoneInput.classList.remove("input-error");
        phoneError.classList.remove("visible");
      }
    });

    card.appendChild(el("label", { class: "field-label" }, ["Recruiter: *"]));
    var recruiterSelect = el("select", { id: "recruiterSelect" });
    recruiterSelect.appendChild(el("option", { value: "", disabled: "disabled", selected: "selected" }, ["Select Recruiter"]));
    RECRUITERS.forEach(function (r) {
      recruiterSelect.appendChild(el("option", { value: r.name }, [formatRecruiterDisplay(r.name)]));
    });
    card.appendChild(recruiterSelect);
    var recruiterError = el("div", { class: "field-error" }, ["Recruiter is required."]);
    card.appendChild(recruiterError);

    // Only shown once more than one variant exists -- a single-option
    // dropdown would just be clutter. Always defaults to Test 1.
    var testNumberSelect = null;
    if (TEST_VARIANTS.length > 1) {
      card.appendChild(el("label", { class: "field-label" }, ["Test Number:"]));
      testNumberSelect = el("select", { id: "testNumberSelect" });
      TEST_VARIANTS.forEach(function (v, i) {
        testNumberSelect.appendChild(el("option", { value: String(i + 1) }, ["Test " + (i + 1)]));
      });
      card.appendChild(testNumberSelect);
    }

    var startBtn = el("button", { class: "btn" }, ["Start Test"]);
    startBtn.addEventListener("click", function () {
      var last = lastNameInput.value.trim();
      var first = firstNameInput.value.trim();
      var recruiter = recruiterSelect.value;
      var d = phoneDigits(phoneInput.value);

      // Name/recruiter fields double as the scores-viewer entry point: typing
      // last="check", first="scores" opens the saved-results screen instead
      // of starting a test, scoped to whichever recruiter is selected --
      // this runs before the recruiter-required check below, so leaving the
      // dropdown blank here still means "every recruiter" in that screen.
      if (last.toLowerCase() === SCORES_ACCESS_LAST && first.toLowerCase() === SCORES_ACCESS_FIRST) {
        renderScoresScreen(recruiter);
        return;
      }

      var hasError = false;
      if (!last) {
        lastNameInput.classList.add("input-error");
        lastNameError.classList.add("visible");
        if (!hasError) { lastNameInput.focus(); hasError = true; }
      } else {
        lastNameInput.classList.remove("input-error");
        lastNameError.classList.remove("visible");
      }

      if (d.length !== 10) {
        phoneInput.classList.add("input-error");
        phoneError.classList.add("visible");
        if (!hasError) { phoneInput.focus(); hasError = true; }
      } else {
        phoneInput.classList.remove("input-error");
        phoneError.classList.remove("visible");
      }

      if (!recruiter) {
        recruiterSelect.classList.add("input-error");
        recruiterError.classList.add("visible");
        if (!hasError) { recruiterSelect.focus(); hasError = true; }
      } else {
        recruiterSelect.classList.remove("input-error");
        recruiterError.classList.remove("visible");
      }

      if (hasError) return;

      var testNumber = testNumberSelect ? parseInt(testNumberSelect.value, 10) : 1;
      QUESTIONS = TEST_VARIANTS[testNumber - 1];

      state.lastName = last;
      state.firstName = first;
      state.phone = formatPhone(d);
      state.recruiter = recruiter;
      state.testNumber = testNumber;
      state.sectionIndex = 0;
      state.answers = {};
      state.finalResults = null;
      state.finalPayload = null;
      state.survey = emptySurvey();
      state.resultPosted = false;
      QUESTIONS.sections.forEach(function (s) { state.answers[s.code] = {}; });
      renderPreTestHandoff();
    });
    // One row for all three buttons, so the start screen still fits a
    // landscape iPad without scrolling now the Army logo sits above it.
    var extraRow = el("div", { class: "btn-row" }, [startBtn, document.createTextNode(" ")]);
    if (PRACTICE) {
      var practiceBtn = el("button", { class: "btn-outline" }, ["Practice Questions"]);
      practiceBtn.addEventListener("click", function () {
        renderPracticeHome({
          lastName: lastNameInput.value.trim(),
          firstName: firstNameInput.value.trim(),
          phone: phoneInput.value.trim(),
          recruiter: recruiterSelect.value
        }, null);
      });
      extraRow.appendChild(practiceBtn);
      extraRow.appendChild(document.createTextNode(" "));
    }
    var tipsBtn = el("button", { class: "btn-outline" }, ["Test-Taking Tips"]);
    tipsBtn.addEventListener("click", function () { renderTestTips(renderStart); });
    extraRow.appendChild(tipsBtn);
    card.appendChild(extraRow);

    app.appendChild(card);
  }

  // ---------- Screen: Test section (one question at a time) ----------
  function startSection(idx) {
    state.sectionIndex = idx;
    state.questionIndex = 0;
    var sec = QUESTIONS.sections[idx];
    state.secondsLeft = sec.minutes * 60;
    renderQuestionScreen(sec);
    if (state.timerHandle) clearInterval(state.timerHandle);
    state.timerHandle = setInterval(function () { tick(sec); }, 1000);
  }

  function tick(sec) {
    state.secondsLeft -= 1;
    var timerEl = document.getElementById("timerDisplay");
    if (timerEl) {
      timerEl.textContent = fmtTime(Math.max(0, state.secondsLeft));
      timerEl.classList.toggle("low", state.secondsLeft <= 30);
    }
    if (state.secondsLeft <= 0) {
      clearInterval(state.timerHandle);
      finishSection(sec, true);
    }
  }

  function goToQuestion(sec, idx) {
    state.questionIndex = idx;
    renderQuestionScreen(sec);
  }

  function renderQuestionScreen(sec) {
    clear(app);
    disarmIdleTimeout();

    var total = sec.questions.length;
    var qIdx = state.questionIndex;
    var q = sec.questions[qIdx];
    var isLastQuestion = qIdx === total - 1;
    var remaining = total - qIdx - 1;

    // Sticky topbar: progress (left, grows) + timer (right, fixed width).
    // Stacks vertically on narrow/mobile screens via CSS, sits in one row on desktop.
    var topbar = el("div", { class: "test-topbar" });
    var topbarInner = el("div", { class: "topbar-inner" });

    var progressWrap = el("div", { class: "progress-wrap" });
    progressWrap.appendChild(el("div", { class: "progress-count" }, [
      "Question " + (qIdx + 1) + " of " + total,
      el("span", { class: "progress-remaining" }, [
        remaining > 0 ? (remaining + " left") : "last question"
      ])
    ]));
    var barOuter = el("div", { class: "progress-bar-outer" });
    barOuter.appendChild(el("div", {
      class: "progress-bar-inner",
      style: "width:" + Math.round(((qIdx + 1) / total) * 100) + "%"
    }));
    progressWrap.appendChild(barOuter);
    topbarInner.appendChild(progressWrap);

    topbarInner.appendChild(el("div", { class: "timer", id: "timerDisplay" }, [fmtTime(state.secondsLeft)]));
    topbar.appendChild(topbarInner);
    app.appendChild(topbar);

    var parsedTitle = parseSectionTitle(sec.title);
    var card = el("div", { class: "card test-card" });
    card.appendChild(el("div", { class: "section-header" }, [
      parsedTitle.part + " - ",
      boldedName(parsedTitle.name)
    ]));

    var answerError = el("div", { class: "field-error question-error" }, ["Please select an answer to continue."]);

    card.appendChild(renderQuestion(sec.code, q, function () {
      answerError.classList.remove("visible");
    }));

    // Forward-only: no way back to a previous question once answered. An
    // answer is required to advance -- clicking Next/Finish (or pressing
    // Enter, which triggers the same click) with nothing selected shows
    // answerError instead of moving on.
    var navRow = el("div", { class: "nav-row" });
    var nextBtn = el("button", { class: "btn" }, [isLastQuestion ? "Finish Section" : "Next →"]);
    nextBtn.addEventListener("click", function () {
      if (!state.answers[sec.code][q.n]) {
        answerError.classList.add("visible");
        return;
      }
      if (isLastQuestion) {
        clearInterval(state.timerHandle);
        finishSection(sec, false);
      } else {
        goToQuestion(sec, qIdx + 1);
      }
    });

    navRow.appendChild(nextBtn);
    card.appendChild(navRow);
    card.appendChild(answerError);

    app.appendChild(card);

    var numberToLetter = { "1": "A", "2": "B", "3": "C", "4": "D" };
    setKeyHandler(function (e) {
      // Proctor shortcut: Ctrl/Cmd+Enter selects the correct answer and
      // advances immediately, for quickly running through a full test.
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        state.answers[sec.code][q.n] = q.correct;
        nextBtn.click();
        return;
      }
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var letter = numberToLetter[e.key] || (e.key.length === 1 ? e.key.toUpperCase() : "");
      if (letter === "A" || letter === "B" || letter === "C" || letter === "D") {
        var radio = document.getElementById(sec.code + "-" + q.n + "-" + letter);
        if (radio) {
          e.preventDefault();
          radio.click();
        }
        return;
      }
      if (e.key === "Enter") {
        e.preventDefault();
        nextBtn.click();
      }
    });
  }

  function renderQuestion(sectionCode, q, onAnswer) {
    var wrap = el("div", { class: "question question-single" });
    wrap.appendChild(el("div", { class: "q-prompt" }, [
      el("span", { class: "q-num" }, [q.n + "."]),
      q.prompt
    ]));

    var list = el("div", { class: "choice-list" });
    ["A", "B", "C", "D"].forEach(function (letter) {
      if (!q.choices[letter]) return;
      var inputId = sectionCode + "-" + q.n + "-" + letter;
      var radio = el("input", {
        type: "radio",
        name: sectionCode + "-" + q.n,
        id: inputId,
        value: letter
      });
      if (state.answers[sectionCode][q.n] === letter) radio.checked = true;
      radio.addEventListener("change", function () {
        state.answers[sectionCode][q.n] = letter;
        Array.prototype.forEach.call(list.querySelectorAll(".choice"), function (c) {
          c.classList.remove("selected");
        });
        choiceRow.classList.add("selected");
        if (onAnswer) onAnswer();
      });
      var choiceRow = el("label", {
        class: "choice" + (state.answers[sectionCode][q.n] === letter ? " selected" : ""),
        for: inputId
      }, [
        radio,
        el("span", { class: "choice-letter" }, [letter + ")"]),
        el("span", {}, [q.choices[letter]])
      ]);
      list.appendChild(choiceRow);
    });
    wrap.appendChild(list);
    return wrap;
  }

  function finishSection(sec, timedOut) {
    // Score and save to the local history the instant the last section ends
    // -- not when someone later clicks through to the results screen -- so
    // an accidental refresh on the STOP screen can't lose the result.
    var isLast = state.sectionIndex >= QUESTIONS.sections.length - 1;
    if (isLast) {
      state.finalResults = computeResults();
      state.finalPayload = buildResultPayload(state.finalResults);
      saveResultToHistory(state.finalPayload);
    }
    renderStop(sec, timedOut);
  }

  // ---------- Screen: STOP ----------
  function buildUpNextBox(sec) {
    var parsed = parseSectionTitle(sec.title);
    var upNext = el("div", { class: "stop-upnext" });
    upNext.appendChild(el("div", { class: "stop-upnext-label" }, ["Up next"]));
    upNext.appendChild(el("div", { class: "stop-upnext-name" }, [boldedName(parsed.name)]));
    upNext.appendChild(el("div", { class: "stop-upnext-meta" }, [
      sec.questions.length + " questions  ·  " + sec.minutes + " minutes"
    ]));
    return upNext;
  }

  function renderStop(sec, timedOut) {
    clear(app);
    setKeyHandler(null);
    var card = el("div", { class: "card" });
    var box = el("div", { class: "stop-box" });

    box.appendChild(el("div", { class: "stop-sign-outer" }, [
      el("div", { class: "stop-sign" }, ["STOP"])
    ]));

    var completedName = parseSectionTitle(sec.title).name;
    var msg = "You've completed " + completedName + (timedOut ? " — time expired." : ".");
    box.appendChild(el("p", { class: "stop-msg" }, [msg]));

    var isLast = state.sectionIndex >= QUESTIONS.sections.length - 1;

    if (!isLast) {
      box.appendChild(el("p", { class: "stop-break" }, ["Take a short break if you need one."]));
      box.appendChild(buildUpNextBox(QUESTIONS.sections[state.sectionIndex + 1]));
    } else {
      // The result isn't sent yet: the readiness questions and name check
      // come first, so the Sheet row and email carry them (renderHandBack).
      box.appendChild(el("p", { class: "stop-break" }, [
        "Before your scores, a few quick questions."
      ]));
    }

    var nextBtn = el("button", { class: "btn" }, ["Continue"]);
    nextBtn.addEventListener("click", function () {
      if (isLast) {
        renderReadiness();
      } else {
        startSection(state.sectionIndex + 1);
      }
    });
    box.appendChild(el("div", { class: "btn-row" }, [nextBtn]));

    card.appendChild(box);
    app.appendChild(card);

    if (isLast) armIdleTimeout(); else disarmIdleTimeout();
  }

  // Shown right after "Start Test" is tapped, before the first section's
  // timer starts -- gives the recruiter a beat to hand the device to the
  // test-taker without eating into their section time (same handoff pattern
  // as the between-section STOP screen, just before section 0 instead of
  // after a completed one).
  function renderPreTestHandoff() {
    clear(app);
    setKeyHandler(null);
    disarmIdleTimeout();
    var card = el("div", { class: "card" });
    var box = el("div", { class: "stop-box" });

    box.appendChild(el("div", { class: "stop-sign-outer" }, [
      el("div", { class: "stop-sign" }, ["STOP"])
    ]));

    box.appendChild(el("p", { class: "stop-msg" }, ["Ready to begin, " + displayName() + "."]));
    box.appendChild(el("p", { class: "stop-break" }, [
      "Hand the device to the test-taker now — the timer starts as soon as you tap Begin."
    ]));
    box.appendChild(el("div", { class: "instructions-box" }, [
      el("strong", {}, ["The clock isn't running yet. "]),
      "Before you tap Begin, write your times table and the formulas you know on your scratch paper, " +
      "so during the test you can look them up instead of working them out. Do the same during the " +
      "untimed instructions on the real ASVAB."
    ]));
    box.appendChild(buildUpNextBox(QUESTIONS.sections[0]));

    var beginBtn = el("button", { class: "btn" }, ["Begin"]);
    beginBtn.addEventListener("click", function () { startSection(0); });
    box.appendChild(el("div", { class: "btn-row" }, [beginBtn]));
    card.appendChild(box);
    app.appendChild(card);
  }

  // ---------- Screens: Readiness questions + name check ----------
  // Between the last section and the results, so the recruiter (Sheet row,
  // per-test email, Results screen, weekly report) sees where the
  // applicant's head is before the scores color the answer. The 1-10
  // rating is required; everything after it can be skipped. A 10 goes
  // straight to the name check. The idle timeout stays armed throughout,
  // and an idle reset sends whatever was answered (postFinalResult).
  var READY_REASONS = [
    "Family or parents' opinion",
    "Want to finish school first",
    "Not sure what job I'd get",
    "Time away from home",
    "Length of the commitment",
    "Fitness or medical worries",
    "Safety or deployment",
    "Pay and benefits unclear",
    "Looking at other branches",
    "Need to talk to someone first"
  ];
  // Kept short: answers ride in the pending-sync cookie when offline.
  var SURVEY_OTHER_MAX = 80;
  var SURVEY_TEXT_MAX = 200;

  function renderReadiness() {
    clear(app);
    setKeyHandler(null);
    armIdleTimeout();
    var card = el("div", { class: "card" });
    card.appendChild(el("h1", {}, ["Are you ready to join the Army?"]));
    card.appendChild(el("p", { class: "survey-hint" }, [
      "Pick a number. There's no wrong answer, and it doesn't change your score."
    ]));

    var nextBtn = el("button", { class: "btn" }, ["Next"]);
    nextBtn.disabled = state.survey.ready === null;

    var scale = el("div", { class: "ready-scale", role: "group", "aria-label": "Ready to join, 1 to 10" });
    var buttons = [];
    for (var n = 1; n <= 10; n++) {
      (function (value) {
        var b = el("button", { type: "button", class: "ready-btn", "aria-pressed": "false" }, [String(value)]);
        if (state.survey.ready === value) { b.classList.add("selected"); b.setAttribute("aria-pressed", "true"); }
        b.addEventListener("click", function () {
          state.survey.ready = value;
          buttons.forEach(function (o) { o.classList.remove("selected"); o.setAttribute("aria-pressed", "false"); });
          b.classList.add("selected");
          b.setAttribute("aria-pressed", "true");
          nextBtn.disabled = false;
        });
        buttons.push(b);
        scale.appendChild(b);
      })(n);
    }
    card.appendChild(scale);
    card.appendChild(el("div", { class: "ready-ends" }, [
      el("span", {}, ["1 = Not at all"]),
      el("span", {}, ["10 = Ready now"])
    ]));

    nextBtn.addEventListener("click", function () {
      if (state.survey.ready === 10) {
        state.survey.reasons = [];
        state.survey.other = "";
        state.survey.makeTen = "";
        renderVerifyInfo();
      } else {
        renderReadinessReasons();
      }
    });
    card.appendChild(el("div", { class: "btn-row" }, [nextBtn]));
    app.appendChild(card);
  }

  function renderReadinessReasons() {
    clear(app);
    setKeyHandler(null);
    armIdleTimeout();
    var card = el("div", { class: "card" });
    card.appendChild(el("h1", {}, ["Why not a 10?"]));
    card.appendChild(el("p", { class: "survey-hint" }, [
      "You picked " + state.survey.ready + ". Tap anything that's holding you back. Skip if you'd rather not say."
    ]));

    var chips = el("div", { class: "note-options" });
    READY_REASONS.forEach(function (reason) {
      var chip = el("button", { type: "button", class: "note-option", "aria-pressed": "false" }, [reason]);
      if (state.survey.reasons.indexOf(reason) !== -1) {
        chip.classList.add("selected");
        chip.setAttribute("aria-pressed", "true");
      }
      chip.addEventListener("click", function () {
        var i = state.survey.reasons.indexOf(reason);
        if (i === -1) state.survey.reasons.push(reason);
        else state.survey.reasons.splice(i, 1);
        chip.classList.toggle("selected", i === -1);
        chip.setAttribute("aria-pressed", i === -1 ? "true" : "false");
      });
      chips.appendChild(chip);
    });
    card.appendChild(chips);

    card.appendChild(el("label", { class: "field-label", for: "readyOther" }, ["Something else?"]));
    var otherInput = el("input", {
      type: "text", id: "readyOther", maxlength: String(SURVEY_OTHER_MAX), placeholder: "Other reason"
    });
    otherInput.value = state.survey.other;
    card.appendChild(otherInput);

    card.appendChild(el("label", { class: "field-label", for: "readyMakeTen" }, ["What would make it a 10?"]));
    var makeTenInput = el("textarea", {
      id: "readyMakeTen", rows: "3", maxlength: String(SURVEY_TEXT_MAX), placeholder: "Optional"
    });
    makeTenInput.value = state.survey.makeTen;
    card.appendChild(makeTenInput);

    function keep() {
      state.survey.other = otherInput.value.trim();
      state.survey.makeTen = makeTenInput.value.trim();
    }
    otherInput.addEventListener("input", keep);
    makeTenInput.addEventListener("input", keep);

    var backBtn = el("button", { class: "btn-outline" }, ["Back"]);
    backBtn.addEventListener("click", function () { keep(); renderReadiness(); });
    var nextBtn = el("button", { class: "btn" }, ["Next"]);
    nextBtn.addEventListener("click", function () { keep(); renderVerifyInfo(); });
    card.appendChild(el("div", { class: "btn-row" }, [backBtn, document.createTextNode(" "), nextBtn]));
    app.appendChild(card);
  }

  function renderVerifyInfo() {
    clear(app);
    setKeyHandler(null);
    armIdleTimeout();
    var card = el("div", { class: "card" });
    card.appendChild(el("h1", {}, ["Is this you?"]));
    card.appendChild(el("p", { class: "survey-hint" }, [
      "Your recruiter will use this to follow up with you."
    ]));

    var body = el("div");
    card.appendChild(body);
    var btnRow = el("div", { class: "btn-row" });
    card.appendChild(btnRow);

    function showConfirm() {
      clear(body);
      clear(btnRow);
      var d = phoneDigits(state.phone);
      if (d.length !== 10) {
        showEdit();
        return;
      }
      var list = el("div", { class: "verify-list" });
      var rows = [
        ["First name", state.firstName || "(blank)", false],
        ["Last name", state.lastName || "(blank)", false],
        ["Phone", formatSpacedPhone(state.phone), true]
      ];
      rows.forEach(function (row) {
        list.appendChild(el("div", { class: "verify-row" }, [
          el("span", {}, [row[0]]),
          el("span", row[2] ? { class: "verify-phone-val" } : {}, [row[1]])
        ]));
      });
      body.appendChild(list);

      var editBtn = el("button", { class: "btn-outline" }, ["Edit"]);
      editBtn.addEventListener("click", showEdit);
      var yesBtn = el("button", { class: "btn" }, ["Yes, that's right"]);
      yesBtn.addEventListener("click", function () {
        if (phoneDigits(state.phone).length !== 10) {
          showEdit();
          return;
        }
        renderHandBack();
      });
      btnRow.appendChild(editBtn);
      btnRow.appendChild(document.createTextNode(" "));
      btnRow.appendChild(yesBtn);
    }

    function showEdit() {
      clear(body);
      clear(btnRow);
      body.appendChild(el("label", { class: "field-label", for: "verifyFirst" }, ["First Name:"]));
      var firstInput = el("input", { type: "text", id: "verifyFirst", placeholder: "First name" });
      firstInput.value = state.firstName;
      body.appendChild(firstInput);

      body.appendChild(el("label", { class: "field-label", for: "verifyLast" }, ["Last Name: *"]));
      var lastInput = el("input", { type: "text", id: "verifyLast", placeholder: "Last name" });
      lastInput.value = state.lastName;
      body.appendChild(lastInput);
      var lastError = el("div", { class: "field-error" }, ["Last name is required."]);
      body.appendChild(lastError);

      body.appendChild(el("label", { class: "field-label", for: "verifyPhone" }, ["Phone Number: *"]));
      var phoneInput = el("input", { type: "tel", id: "verifyPhone", placeholder: "(XXX) XXX-XXXX" });
      phoneInput.value = formatPhone(state.phone);
      body.appendChild(phoneInput);
      var phoneError = el("div", { class: "field-error" }, ["A valid 10-digit phone number is required."]);
      body.appendChild(phoneError);

      phoneInput.addEventListener("blur", function () {
        var d = phoneDigits(phoneInput.value);
        if (d.length === 10) phoneInput.value = formatPhone(d);
      });
      phoneInput.addEventListener("input", function () {
        var d = phoneDigits(phoneInput.value);
        if (d.length === 10) {
          phoneInput.classList.remove("input-error");
          phoneError.classList.remove("visible");
        }
      });

      var saveBtn = el("button", { class: "btn" }, ["Save"]);
      saveBtn.addEventListener("click", function () {
        var last = lastInput.value.trim();
        var d = phoneDigits(phoneInput.value);
        var hasError = false;

        if (!last) {
          lastInput.classList.add("input-error");
          lastError.classList.add("visible");
          if (!hasError) { lastInput.focus(); hasError = true; }
        } else {
          lastInput.classList.remove("input-error");
          lastError.classList.remove("visible");
        }

        if (d.length !== 10) {
          phoneInput.classList.add("input-error");
          phoneError.classList.add("visible");
          if (!hasError) { phoneInput.focus(); hasError = true; }
        } else {
          phoneInput.classList.remove("input-error");
          phoneError.classList.remove("visible");
        }

        if (hasError) return;

        state.firstName = firstInput.value.trim();
        state.lastName = last;
        state.phone = formatPhone(d);
        showConfirm();
      });
      btnRow.appendChild(saveBtn);
      (state.lastName ? phoneInput : firstInput).focus();
    }

    var backBtn = el("button", { class: "btn-outline" }, ["Back"]);
    backBtn.addEventListener("click", function () {
      if (state.survey.ready === 10) renderReadiness(); else renderReadinessReasons();
    });

    showConfirm();
    card.appendChild(el("div", { class: "btn-row" }, [backBtn]));
    app.appendChild(card);
  }

  // Where the result is finally sent -- the old last-STOP hand-back, moved
  // after the readiness questions.
  function renderHandBack() {
    clear(app);
    setKeyHandler(null);
    postFinalResult();
    var card = el("div", { class: "card" });
    var box = el("div", { class: "stop-box" });
    box.appendChild(el("div", { class: "army-logo-wrap" }, [
      el("img", { src: "./assets/army_logo_horiz.svg", alt: "U.S. Army", class: "army-logo" })
    ]));
    box.appendChild(el("p", { class: "stop-msg" }, ["Thanks" + (state.firstName ? ", " + state.firstName : "") + "."]));
    box.appendChild(el("p", { class: "stop-break" }, [
      "Please return this device to your recruiter to review your scores."
    ]));
    box.appendChild(renderRecruiterContact());
    var resultsBtn = el("button", { class: "btn" }, ["Continue to Results"]);
    resultsBtn.addEventListener("click", renderResults);
    box.appendChild(el("div", { class: "btn-row" }, [resultsBtn]));
    card.appendChild(box);
    app.appendChild(card);
    armIdleTimeout();
  }

  // ---------- QR codes ----------
  // assets/qrcode.js (qrcode-generator, MIT) draws them on the device, so
  // nothing about the applicant leaves the kiosk. Byte mode in UTF-8 so
  // names with accents survive. If linkUrl is provided, clicking or tapping
  // the QR code opens the link (e.g. HiHello) or downloads the vCard on mobile.
  function buildQr(text, label, sub, linkUrl, downloadName) {
    var qr = qrcode(0, "M");
    qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
    qr.addData(text, "Byte");
    qr.make();
    var svgHolder = el("div", { role: "img", "aria-label": label + " QR code" });
    svgHolder.innerHTML = qr.createSvgTag({ cellSize: 4, margin: 4, scalable: true });

    var graphicEl = svgHolder;
    if (linkUrl) {
      var linkProps = {
        class: "qr-link",
        href: linkUrl,
        title: label || "Save contact"
      };
      if (downloadName) linkProps.download = downloadName;
      if (/^https?:\/\//i.test(linkUrl)) {
        linkProps.target = "_blank";
        linkProps.rel = "noopener noreferrer";
      }
      graphicEl = el("a", linkProps, [svgHolder]);
    }

    var item = el("div", { class: "qr-item" }, [graphicEl, el("div", { class: "qr-label" }, [label])]);
    if (sub) item.appendChild(el("div", { class: "qr-sub" }, [sub]));

    if (linkUrl) {
      var btnProps = {
        class: "btn-outline btn-small qr-tap-btn",
        href: linkUrl
      };
      if (downloadName) btnProps.download = downloadName;
      if (/^https?:\/\//i.test(linkUrl)) {
        btnProps.target = "_blank";
        btnProps.rel = "noopener noreferrer";
      }
      var isWeb = /^https?:\/\//i.test(linkUrl);
      var btnText = isWeb ? "Open Contact Card" : "Save Contact";
      item.appendChild(el("div", {}, [el("a", btnProps, [btnText])]));
    }
    return item;
  }

  function phoneDigits(phone) {
    var digits = String(phone || "").replace(/\D/g, "");
    if (digits.length === 11 && digits.charAt(0) === "1") digits = digits.slice(1);
    return digits.length === 10 ? digits : "";
  }

  function formatPhone(phone) {
    var d = phoneDigits(phone);
    return d ? "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6) : String(phone || "");
  }

  function formatSpacedPhone(phone) {
    var d = phoneDigits(phone);
    return d ? "(" + d.slice(0, 3) + ")   " + d.slice(3, 6) + "  -  " + d.slice(6) : String(phone || "(blank)");
  }

  // vCard field values: escape the characters vCard treats as separators.
  function vcardText(value) {
    return String(value || "").replace(/\\/g, "\\\\").replace(/([,;])/g, "\\$1").replace(/\r?\n/g, " ");
  }

  function vcard(fields) {
    var lines = ["BEGIN:VCARD", "VERSION:3.0",
      "N:" + vcardText(fields.last) + ";" + vcardText(fields.first) + ";;" + vcardText(fields.prefix) + ";",
      "FN:" + vcardText(fields.full)];
    if (fields.org) lines.push("ORG:" + vcardText(fields.org));
    if (fields.title) lines.push("TITLE:" + vcardText(fields.title));
    if (fields.phone) lines.push("TEL;TYPE=CELL:+1" + fields.phone);
    if (fields.email) lines.push("EMAIL;TYPE=INTERNET:" + vcardText(fields.email));
    if (fields.address) {
      var a = fields.address;
      if (typeof a === "object") {
        lines.push("ADR;TYPE=WORK:;;" + vcardText(a.street || "") + ";" + vcardText(a.city || "") + ";" +
          vcardText(a.state || "") + ";" + vcardText(a.zip || "") + ";USA");
      } else {
        lines.push("ADR;TYPE=WORK:;;" + vcardText(String(a)) + ";;;;");
      }
    }
    if (fields.note) lines.push("NOTE:" + vcardText(fields.note));
    lines.push("END:VCARD");
    return lines.join("\r\n");
  }

  // Hand-back screen & practice screens: who the applicant's recruiter is,
  // with a code to save them as a contact (or open their HiHello card).
  // Includes recruiter phone, official email, and station address.
  // Clicking the QR code or the tap button saves the contact or opens HiHello
  // directly on mobile devices where scanning the screen isn't possible.
  function renderRecruiterContact(customRecruiter) {
    var info = recruiterInfo(customRecruiter || state.recruiter);
    var display = formatRecruiterDisplay(info.name);
    var digits = phoneDigits(info.phone);
    var email = (info.email || "").trim();
    var addrObj = formatStationAddress(info.address || CONFIG.stationAddress);
    var hiHello = info.hiHelloUrl ? String(info.hiHelloUrl).trim() : "";

    var wrap = el("div", { class: "recruiter-card" });
    wrap.appendChild(el("div", { class: "qr-sub" }, ["Your recruiter"]));
    wrap.appendChild(el("div", { class: "recruiter-name" }, [display]));
    if (digits) {
      wrap.appendChild(el("div", { class: "recruiter-phone" }, [formatPhone(digits)]));
    }
    if (email) {
      var emailLink = el("a", { href: "mailto:" + email }, [email]);
      wrap.appendChild(el("div", { class: "recruiter-email" }, [emailLink]));
    }
    if (addrObj && addrObj.text) {
      wrap.appendChild(el("div", { class: "recruiter-address" }, [addrObj.text]));
    }

    if (digits || hiHello || email) {
      var parts = info.name.split(/\s+/);
      var rank = parts.length > 1 ? parts[parts.length - 1] : "";
      var last = parts.length > 1 ? parts.slice(0, -1).join(" ") : info.name;

      var qrContent = "";
      var linkUrl = "";
      var downloadName = "";
      var subText = "";

      if (hiHello) {
        qrContent = hiHello;
        linkUrl = hiHello;
        downloadName = "";
        subText = "Scan with phone camera or tap to open";
      } else {
        var vcardData = vcard({
          last: last, first: "", prefix: rank, full: display,
          org: "U.S. Army", title: "Recruiter", phone: digits,
          email: email, address: addrObj
        });
        qrContent = vcardData;
        linkUrl = "data:text/vcard;charset=utf-8," + encodeURIComponent(vcardData);
        var safeName = (rank ? rank + "_" : "") + last;
        downloadName = safeName.replace(/[^a-zA-Z0-9_-]/g, "_") + ".vcf";
        subText = "Scan with phone camera or tap to save";
      }

      wrap.appendChild(el("div", { class: "qr-grid" }, [
        buildQr(qrContent, "Save my number", subText, linkUrl, downloadName)
      ]));
    }
    return wrap;
  }

  function readinessReasonsText(survey) {
    var list = survey.reasons.slice();
    if (survey.other) list.push("Other: " + survey.other);
    return list.join("; ");
  }

  // Sends the finished test once, with the checked name/phone and the
  // readiness answers. Called from renderHandBack, or from an idle reset
  // if the test-taker walked off before getting there.
  function postFinalResult() {
    if (!state.finalPayload || state.resultPosted) return;
    state.resultPosted = true;
    var p = state.finalPayload;
    var survey = state.survey || emptySurvey();
    p.last_name = state.lastName;
    p.first_name = state.firstName;
    p.phone = state.phone;
    p.ready = survey.ready === null ? "" : survey.ready;
    p.not_ten_reasons = readinessReasonsText(survey);
    p.make_it_ten = survey.makeTen;
    updateHistoryIdentity(p);
    postResultsToWebhook(p);
  }

  // ---------- Scoring ----------
  function vlookupApprox(lookupValue, table, keyIdx, valIdx) {
    var result = null;
    for (var i = 0; i < table.length; i++) {
      var row = table[i];
      var key = row[keyIdx];
      var val = row[valIdx];
      if (key === null || val === null) continue;
      if (key <= lookupValue) result = val;
      else break;
    }
    return result;
  }

  function scoreSection(sec) {
    var total = sec.questions.length;
    var correct = 0;
    var unanswered = 0;
    sec.questions.forEach(function (q) {
      var ans = state.answers[sec.code][q.n];
      if (!ans) unanswered++;
      else if (ans === q.correct) correct++;
    });
    return { total: total, correct: correct, unanswered: unanswered, pct: (100 * correct / total) };
  }

  function computeResults() {
    var byCode = {};
    QUESTIONS.sections.forEach(function (sec) { byCode[sec.code] = scoreSection(sec); });

    var rawTable = SCORING.raw_table; // [raw, ve_std, ar_std, mk_std]

    // The raw->standard table's own range (VE to 52, AR to 30, MK to 26) is the
    // REAL full-length ASVAB's question count -- exactly double this practice
    // test's (VE 26, AR 15, MK 13). A perfect practice score should therefore
    // land at the table's top row, not its midpoint, so each raw count is
    // doubled before the lookup. See README: "AFQT scaling fix."
    var rawVE = (byCode.WK.correct + byCode.PC.correct) * 2;
    var veStdBase = vlookupApprox(rawVE, rawTable, 0, 1) || 0;
    var veScore = veStdBase * 2;

    var arScore = vlookupApprox(byCode.AR.correct * 2, rawTable, 0, 2) || 0;
    var mkScore = vlookupApprox(byCode.MK.correct * 2, rawTable, 0, 3) || 0;

    var stdSum = veScore + arScore + mkScore;
    var aqft = vlookupApprox(stdSum, SCORING.pct_table, 0, 1);
    if (aqft === null) aqft = 99;

    var overallCorrect = 0, overallTotal = 0;
    Object.keys(byCode).forEach(function (code) {
      overallCorrect += byCode[code].correct;
      overallTotal += byCode[code].total;
    });
    var overallPct = 100 * overallCorrect / overallTotal;

    return {
      byCode: byCode, rawVE: rawVE, veScore: veScore, arScore: arScore, mkScore: mkScore,
      stdSum: stdSum, aqft: aqft, overallCorrect: overallCorrect, overallTotal: overallTotal, overallPct: overallPct
    };
  }

  // Section % correct -> a status band. This colors the per-section meters
  // (which read 0-100% and are honest to band by color). The AFQT hero
  // number deliberately does NOT get this treatment -- it's a percentile
  // projected through the (rescaled) full-length-ASVAB norm tables, not a
  // raw 0-100% score (see README). Banding it red/green would misrepresent
  // it as a pass/fail cutoff it was never designed to be.
  function statusBand(pct) {
    if (pct >= 70) return { key: "good", label: "Strong" };
    if (pct >= 40) return { key: "warning", label: "Needs review" };
    return { key: "critical", label: "Keep practicing" };
  }

  // ---------- Local result history (cookie) ----------
  // Every completed test is appended to a capped JSON array kept in a cookie
  // on this browser/device -- a durable local record of name, recruiter, and
  // scores that survives even when there's no server to POST to (see the
  // standalone note in loadData above). This runs for BOTH builds: it's a
  // local backup alongside the server save for the server-backed build, and
  // the only persistence at all for a bare file:// standalone build.
  var RESULTS_COOKIE = "est_results_history";
  var RESULTS_COOKIE_MAX_ENTRIES = 25;
  var RESULTS_COOKIE_MAX_DAYS = 365;
  var RESULTS_COOKIE_MAX_BYTES = 3800; // stay under the ~4KB per-cookie ceiling

  function setCookie(name, value, days) {
    var expires = "";
    if (days) {
      var date = new Date();
      date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
      expires = "; expires=" + date.toUTCString();
    }
    document.cookie = name + "=" + encodeURIComponent(value) + expires + "; path=/; SameSite=Lax";
  }

  function getCookie(name) {
    var prefix = name + "=";
    var parts = document.cookie.split(";");
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i].replace(/^\s+/, "");
      if (part.indexOf(prefix) === 0) return decodeURIComponent(part.slice(prefix.length));
    }
    return null;
  }

  function getResultsHistory() {
    var raw = getCookie(RESULTS_COOKIE);
    if (!raw) return [];
    try {
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function saveResultToHistory(entry) {
    var history = getResultsHistory();
    history.push(entry);
    while (history.length > RESULTS_COOKIE_MAX_ENTRIES) history.shift();
    var serialized = JSON.stringify(history);
    // Belt-and-suspenders: keep dropping the oldest entry if we're still
    // near the cookie size ceiling (e.g. unusually long names).
    while (serialized.length > RESULTS_COOKIE_MAX_BYTES && history.length > 1) {
      history.shift();
      serialized = JSON.stringify(history);
    }
    setCookie(RESULTS_COOKIE, serialized, RESULTS_COOKIE_MAX_DAYS);
  }

  // The name check runs after the result is already in the history, so
  // correct that entry in place. The readiness answers stay out of the
  // cookie; they only go to the Sheet.
  function updateHistoryIdentity(payload) {
    var history = getResultsHistory();
    for (var i = history.length - 1; i >= 0; i--) {
      if (history[i].timestamp === payload.timestamp) {
        history[i].last_name = payload.last_name;
        history[i].first_name = payload.first_name;
        history[i].phone = payload.phone;
        setCookie(RESULTS_COOKIE, JSON.stringify(history), RESULTS_COOKIE_MAX_DAYS);
        return;
      }
    }
  }

  // Results that failed to sync to the webhook (offline, or the server
  // errored) are queued here and retried automatically -- on the browser's
  // "online" event, on a periodic safety-net interval (in case "online"
  // doesn't fire reliably on flaky/captive-portal-style connections), and
  // once at boot in case the kiosk was closed while still offline. Survives
  // across reloads/restarts for the same reason RESULTS_COOKIE does: a
  // kiosk can sit disconnected for a long stretch and needs to catch up
  // whenever it eventually reconnects, not just within the current session.
  var PENDING_SYNC_COOKIE = "est_pending_sync";
  var PENDING_SYNC_MAX_ENTRIES = 25;
  var PENDING_SYNC_MAX_DAYS = 365;
  var PENDING_SYNC_MAX_BYTES = 3800;
  var PENDING_SYNC_RETRY_MS = 2 * 60 * 1000;

  function getPendingSyncQueue() {
    var raw = getCookie(PENDING_SYNC_COOKIE);
    if (!raw) return [];
    try {
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function savePendingSyncQueue(queue) {
    while (queue.length > PENDING_SYNC_MAX_ENTRIES) queue.shift();
    var serialized = JSON.stringify(queue);
    // Over the size limit: drop the oldest entries' free-text readiness
    // answers before dropping anyone's scores.
    for (var i = 0; serialized.length > PENDING_SYNC_MAX_BYTES && i < queue.length - 1; i++) {
      delete queue[i].not_ten_reasons;
      delete queue[i].make_it_ten;
      serialized = JSON.stringify(queue);
    }
    while (serialized.length > PENDING_SYNC_MAX_BYTES && queue.length > 1) {
      queue.shift();
      serialized = JSON.stringify(queue);
    }
    setCookie(PENDING_SYNC_COOKIE, serialized, PENDING_SYNC_MAX_DAYS);
  }

  function enqueuePendingSync(payload) {
    var queue = getPendingSyncQueue();
    queue.push(payload);
    savePendingSyncQueue(queue);
  }

  // Best-effort background catch-up -- not tied to any on-screen status
  // element, since the STOP screen that originally reported the failure
  // may be long gone by the time connectivity returns. Silent on success;
  // whatever's still unsent stays queued for the next attempt.
  function flushPendingSyncQueue() {
    if (!RESULTS_WEBHOOK_URL) return;
    var queue = getPendingSyncQueue();
    if (!queue.length) return;

    var stillPending = [];
    var remaining = queue.length;
    queue.forEach(function (payload) {
      fetch(RESULTS_WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).then(function (r) { return r.json(); }).then(function (res) {
        if (!res || !res.ok) stillPending.push(payload);
      }).catch(function () {
        stillPending.push(payload);
      }).then(function () {
        remaining--;
        if (remaining === 0) savePendingSyncQueue(stillPending);
      });
    });
  }

  // Shared shape for both the cookie history entry and the server POST body.
  function buildResultPayload(results) {
    var payload = {
      last_name: state.lastName,
      first_name: state.firstName,
      phone: state.phone,
      recruiter: state.recruiter,
      test_number: state.testNumber,
      test_key: QUESTIONS.key,
      timestamp: new Date().toISOString(),
      sections: {},
      ve_score: results.veScore,
      ar_score: results.arScore,
      mk_score: results.mkScore,
      std_sum: results.stdSum,
      afqt: results.aqft
    };
    Object.keys(results.byCode).forEach(function (code) {
      var r = results.byCode[code];
      payload.sections[code] = { correct: r.correct, total: r.total, unanswered: r.unanswered };
    });
    return payload;
  }

  // Sent as text/plain (not application/json) so the browser treats it as a
  // "simple request" and skips the CORS preflight -- Apps Script's web app
  // endpoint issues a redirect for POST requests that a preflight can choke
  // on. results-webhook.gs parses the body as JSON regardless of the header.
  //
  // Silent, like flushPendingSyncQueue -- the local cookie history is
  // already the durable record by the time this runs (see finishSection),
  // and the STOP screen's job is just "hand the device back", not narrate
  // sync plumbing. A failure here enqueues for automatic retry rather than
  // surfacing anything on screen.
  function postResultsToWebhook(payload) {
    if (!RESULTS_WEBHOOK_URL) return;
    fetch(RESULTS_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (!res || !res.ok) enqueuePendingSync(payload);
    }).catch(function () {
      enqueuePendingSync(payload);
    });
  }

          out.push(el("span", { class: "tactic-pop" }, [part.slice(2, -2)]));

          out.push(document.createTextNode(part));
        }
      });
      return out;

  function buildTimesTable() {
    var table = el("table", { class: "times-table" });
    for (var r = 0; r <= 12; r++) {
      var tr = el("tr");

        if (r === 0 && c === 0) tr.appendChild(el("th", {}, ["×"]));
        else if (r === 0 || c === 0) tr.appendChild(el("th", {}, [String(r || c)]));
        else tr.appendChild(el("td", {}, [String(r * c)]));
      }
      table.appendChild(tr);
    }
    return table;

  // ---------- Practice mode ----------
  // Untimed drills from the local-only practice bank (see the
  // local-bank/practice-data.js script tag). Each answer is graded the
  // moment it's tapped, with the explanation shown right away -- the point
  // is learning, not a score -- so nothing here touches the graded-test
  // state or the Results sheet. A finished drill is logged one-way to the
  // webhook's Practice tab (type: "practice") so the Friday report shows
  // who studied; nothing is ever read back.
  var PRACTICE_DRILL_SIZE = 10;
  var PRACTICE_SEEN_KEY = "est_practice_seen";
  var PRACTICE_ORDER = ["AR", "MK", "WK", "PC"];

  // Per-device count of how often each question has been served, so drills
  // rotate through the whole bank instead of repeating the same ten.
  // localStorage can be unavailable (private mode) -- then every drill is
  // just a fresh random pick, which is fine.
  function getPracticeSeen() {
    try {
      return JSON.parse(localStorage.getItem(PRACTICE_SEEN_KEY) || "{}") || {};
    } catch (e) {
      return {};
    }
  }

  function markPracticeSeen(ids) {
    var seen = getPracticeSeen();
    ids.forEach(function (id) { seen[id] = (seen[id] || 0) + 1; });
    try {
      localStorage.setItem(PRACTICE_SEEN_KEY, JSON.stringify(seen));
    } catch (e) {
      // Storage full or blocked: rotation just stops being remembered.
    }
  }

  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  // Least-served questions first, random within each tier.
  function pickPracticeDrill(code) {
    var seen = getPracticeSeen();
    var pool = shuffle(PRACTICE.sections[code].questions.slice());
    pool.sort(function (a, b) { return (seen[a.id] || 0) - (seen[b.id] || 0); });
    return pool.slice(0, PRACTICE_DRILL_SIZE);
  }

  // Lowest-scoring section on a just-finished test (ties go to test order).
  // Lowest percent-correct section that has practice questions. On a tie,
  // Arithmetic Reasoning if it's one of the tied sections, else the first
  // in test order. results-webhook.gs weakestSectionCode() picks the same
  // way for the recruiter's text; keep the two in sync.
  function weakestSectionCode(results) {
    var worst = null, tied = [];
    QUESTIONS.sections.forEach(function (sec) {
      if (!PRACTICE.sections[sec.code]) return;
      var pct = results.byCode[sec.code].pct;
      if (worst === null || pct < worst) { worst = pct; tied = [sec.code]; }
      else if (pct === worst) tied.push(sec.code);
    });
    if (tied.indexOf("AR") !== -1) return "AR";
    return tied[0] || null;
  }

  // The last practice name/phone, kept in memory only (never in storage)
  // so it can prefill the Practice screen for the same person coming back
  // for another round. It's forgotten PRACTICE_IDENTITY_TTL_MS after their
  // last tap, and practice screens idle back to Start after the same
  // stretch, so whoever picks the kiosk up next never sees it.
  var PRACTICE_IDENTITY_TTL_MS = 15 * 60 * 1000;
  var lastPracticeIdentity = null;

  function rememberPracticeIdentity(identity) {
    if (!identity.lastName && !identity.phone) return;
    lastPracticeIdentity = {
      lastName: identity.lastName || "", firstName: identity.firstName || "",
      phone: identity.phone || "", recruiter: identity.recruiter || "", at: Date.now()
    };
  }

  function recentPracticeIdentity() {
    if (lastPracticeIdentity && Date.now() - lastPracticeIdentity.at >= PRACTICE_IDENTITY_TTL_MS) {
      lastPracticeIdentity = null;
    }
    return lastPracticeIdentity;
  }

  function practiceIdentityFromState() {
    return { lastName: state.lastName, firstName: state.firstName, phone: state.phone, recruiter: state.recruiter };
  }

  function renderPracticeSuggestion(results) {
    var code = weakestSectionCode(results);
    var wrap = el("div", { class: "instructions-box" });
    if (!code) return wrap;
    wrap.appendChild(el("div", {}, [
      "Biggest room to grow: " + PRACTICE.sections[code].name +
      ". Practice questions show the answer and an explanation right after each one."
    ]));
    var btn = el("button", { class: "btn" }, ["Practice " + PRACTICE.sections[code].name]);
    btn.addEventListener("click", function () {
      startPracticeDrill(practiceIdentityFromState(), code);
    });
    var buttons = [btn, " ", other];
    if (code === "AR" || code === "MK") {
      var flashBtn = el("button", { class: "btn-outline" }, ["⚡ Flashcards"]);
      flashBtn.addEventListener("click", function () {
        renderFlashcards(practiceIdentityFromState(), "sprint10", renderResults);
      });
      buttons.push(" ", flashBtn);
    }
    wrap.appendChild(el("div", { class: "btn-row" }, buttons));
    return wrap;
  }

  function renderPracticeHome(identity, suggestedCode) {
    clear(app);
    setKeyHandler(null);
    armIdleTimeout(PRACTICE_IDENTITY_TTL_MS);
    var card = el("div", { class: "card" });
    card.appendChild(el("h1", {}, ["Practice Questions"]));
    card.appendChild(el("p", { class: "byline" }, [
      "Untimed. " + PRACTICE_DRILL_SIZE + " questions per round, with the answer and explanation after each one."
    ]));

    // Name/phone are optional here -- they only label the practice log for
    // the weekly report. Whatever the previous screen (Start, Results, or a
    // finished round) had wins; with nothing there, fall back to the last
    // practice name/phone if it's still under 15 minutes old.
    var prefill = (identity && (identity.lastName || identity.phone || identity.recruiter)) ? identity : (recentPracticeIdentity() || {});
    card.appendChild(el("label", { class: "field-label" }, ["Last Name (optional):"]));
    var lastInput = el("input", { type: "text", placeholder: "Last name" });
    lastInput.value = prefill.lastName || "";
    card.appendChild(lastInput);
    card.appendChild(el("label", { class: "field-label" }, ["Phone Number (optional):"]));
    var phoneInput = el("input", { type: "tel", placeholder: "Phone number" });
    phoneInput.value = prefill.phone || "";
    card.appendChild(phoneInput);
    if (prefill.lastName || prefill.phone) {
      var notYou = el("button", { class: "btn-outline btn-small" }, ["Not you? Clear"]);
      notYou.addEventListener("click", function () {
        lastPracticeIdentity = null;
        prefill = {};
        lastInput.value = "";
        phoneInput.value = "";
        notYou.style.display = "none";
        lastInput.focus();
      });
      card.appendChild(el("div", {}, [notYou]));
    }

    // First name and station aren't on this screen, so they only carry
    // over while the last name still matches the prefilled person.
    function identityFromInputs() {
      var last = lastInput.value.trim();
      var same = last && last.toLowerCase() === String(prefill.lastName || "").toLowerCase();
      return {
        lastName: last,
        phone: phoneInput.value.trim(),
        firstName: same ? prefill.firstName || "" : "",
        recruiter: same ? prefill.recruiter || "" : (prefill.recruiter || state.recruiter || "")
      };
    }

    var flashBanner = el("div", { class: "flashcards-banner" });
    flashBanner.appendChild(el("div", { class: "flashcards-banner-title" }, ["⚡ Rapid Mental Math Flashcards"]));
    flashBanner.appendChild(el("div", { class: "flashcards-banner-desc" }, [
      "Speed drills on fractions, squares, geometry, and conversions. Tap to flip and build fast mental reflexes for the math sections."
    ]));
    var flashBtn = el("button", { class: "btn", style: "align-self:flex-start; margin-top:4px;", type: "button" }, ["Start Flashcard Drill"]);
    flashBtn.addEventListener("click", function () {
      renderFlashcards(identityFromInputs(), "sprint10", function () {
        renderPracticeHome(identityFromInputs(), suggestedCode);
      });
    });
    flashBanner.appendChild(flashBtn);
    card.appendChild(flashBanner);

    card.appendChild(el("h2", { class: "subtitle", style: "margin: 18px 0 8px;" }, ["Practice Questions by Section"]));

    var seen = getPracticeSeen();
    var list = el("div", { class: "practice-sections" });
    PRACTICE_ORDER.forEach(function (code) {
      var sec = PRACTICE.sections[code];
      if (!sec) return;
      var done = sec.questions.filter(function (q) { return seen[q.id]; }).length;
      var btn = el("button", { class: "practice-section-btn" + (code === suggestedCode ? " suggested" : "") }, [
        el("span", {}, [sec.name]),
        el("span", { class: "practice-section-meta" }, [done + " of " + sec.questions.length + " seen"])
      ]);
      btn.addEventListener("click", function () {
        startPracticeDrill(identityFromInputs(), code);
      });
      list.appendChild(btn);
    });
    card.appendChild(list);

    card.appendChild(renderRecruiterContact(prefill && prefill.recruiter));

    var back = el("button", { class: "btn-outline" }, ["Back to Start"]);
    back.addEventListener("click", renderStart);
    var tips = el("button", { class: "btn-outline" }, ["Test-Taking Tips"]);
    tips.addEventListener("click", function () {
      var current = identityFromInputs();
      renderTestTips(function () { renderPracticeHome(current, suggestedCode); });
    });
    card.appendChild(el("div", { class: "btn-row" }, [back, " ", tips]));
    app.appendChild(card);
  }

  function startPracticeDrill(identity, code) {
    rememberPracticeIdentity(identity);
    var drill = { identity: identity, code: code, questions: pickPracticeDrill(code), index: 0, picks: {} };
    markPracticeSeen(drill.questions.map(function (q) { return q.id; }));
    renderPracticeQuestion(drill);
  }

  function renderPracticeQuestion(drill) {
    clear(app);
    armIdleTimeout(PRACTICE_IDENTITY_TTL_MS);
    var q = drill.questions[drill.index];
    var total = drill.questions.length;
    var isLast = drill.index === total - 1;

    var card = el("div", { class: "card test-card" });
    card.appendChild(el("div", { class: "section-header" }, [
      "Practice: " + PRACTICE.sections[drill.code].name + "  ·  Question " + (drill.index + 1) + " of " + total
    ]));

    var wrap = el("div", { class: "question question-single" });
    wrap.appendChild(el("div", { class: "q-prompt" }, [
      el("span", { class: "q-num" }, [(drill.index + 1) + "."]),
      q.prompt
    ]));
    var list = el("div", { class: "choice-list" });
    var rows = {};
    var feedback = el("div", {});
    var nextBtn = el("button", { class: "btn", style: "display:none" }, [isLast ? "See Results" : "Next →"]);

    function choose(letter) {
      if (drill.picks[q.id]) return;
      drill.picks[q.id] = letter;
      rememberPracticeIdentity(drill.identity); // restarts the 15-minute window
      showAnswer(letter);
      nextBtn.focus();
    }

    // Also used on re-render, e.g. coming back from the tips screen to a
    // question that was already answered.
    function showAnswer(letter) {
      Object.keys(rows).forEach(function (l) {
        rows[l].classList.add("practice-locked");
        if (l === q.correct) rows[l].classList.add("practice-correct");
        else if (l === letter) rows[l].classList.add("practice-wrong");
      });
      var right = letter === q.correct;
      feedback.appendChild(el("div", { class: "practice-verdict " + (right ? "right" : "wrong") }, [
        right ? "Correct!" : "Not quite. The answer is " + q.correct + ") " + q.choices[q.correct]
      ]));
      feedback.appendChild(el("div", { class: "explain-box" }, [q.explanation]));
      nextBtn.style.display = "";
    }

    ["A", "B", "C", "D"].forEach(function (letter) {
      if (!q.choices[letter]) return;
      var row = el("div", { class: "choice practice-choice", role: "button", tabindex: "0" }, [
        el("span", { class: "choice-letter" }, [letter + ")"]),
        el("span", {}, [q.choices[letter]])
      ]);
      row.addEventListener("click", function () { choose(letter); });
      rows[letter] = row;
      list.appendChild(row);
    });
    wrap.appendChild(list);
    card.appendChild(wrap);
    card.appendChild(feedback);

    nextBtn.addEventListener("click", function () {
      if (isLast) {
        renderPracticeSummary(drill);
      } else {
        drill.index++;
        renderPracticeQuestion(drill);
      }
    });
    card.appendChild(el("div", { class: "nav-row" }, [nextBtn]));
    app.appendChild(card);
    if (drill.picks[q.id]) showAnswer(drill.picks[q.id]);

    var numberToLetter = { "1": "A", "2": "B", "3": "C", "4": "D" };
    setKeyHandler(function (e) {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      var letter = numberToLetter[e.key] || (e.key.length === 1 ? e.key.toUpperCase() : "");
      if (rows[letter] && !drill.picks[q.id]) {
        e.preventDefault();
        choose(letter);
      } else if (e.key === "Enter" && drill.picks[q.id]) {
        e.preventDefault();
        nextBtn.click();
      }
    });
  }

  function renderPracticeSummary(drill) {
    clear(app);
    setKeyHandler(null);
    armIdleTimeout(PRACTICE_IDENTITY_TTL_MS);
    var missed = drill.questions.filter(function (q) { return drill.picks[q.id] !== q.correct; });
    var correct = drill.questions.length - missed.length;
    // Once per round, though the tips screen can bring this screen back.
    if (!drill.logged) {
      drill.logged = true;
      logPracticeDrill(drill, correct);
    }

    var card = el("div", { class: "card" });
    card.appendChild(el("h1", {}, ["Practice Results"]));
    card.appendChild(el("p", { class: "byline" }, [PRACTICE.sections[drill.code].name]));
    var hero = el("div", { class: "hero" });
    hero.appendChild(el("div", { class: "hero-value" }, [correct + " / " + drill.questions.length]));
    hero.appendChild(el("div", { class: "hero-label" }, ["Correct"]));
    card.appendChild(hero);

    if (missed.length) {
      card.appendChild(el("h2", { class: "subtitle" }, ["Review what you missed"]));
      missed.forEach(function (q) {
        card.appendChild(el("div", { class: "practice-review-item" }, [
          el("div", { class: "practice-review-prompt" }, [q.prompt]),
          el("div", { class: "practice-review-answer" }, ["Answer: " + q.correct + ") " + q.choices[q.correct]]),
          el("div", { class: "explain-box" }, [q.explanation])
        ]));
      });
    }

    card.appendChild(renderRecruiterContact(drill.identity && drill.identity.recruiter));

    var again = el("button", { class: "btn" }, ["Another Round"]);
    again.addEventListener("click", function () { startPracticeDrill(drill.identity, drill.code); });
    var pick = el("button", { class: "btn-outline" }, ["Choose a section"]);
    pick.addEventListener("click", function () { renderPracticeHome(drill.identity, drill.code); });
    var flash = el("button", { class: "btn-outline" }, ["⚡ Flashcards"]);
    flash.addEventListener("click", function () {
      renderFlashcards(drill.identity, "sprint10", function () {
        renderPracticeSummary(drill);
      });
    });
    var tips = el("button", { class: "btn-outline" }, ["Test-Taking Tips"]);
    tips.addEventListener("click", function () {
      renderTestTips(function () { renderPracticeSummary(drill); });
    });
    var done = el("button", { class: "btn-outline" }, ["Done"]);
    done.addEventListener("click", renderStart);
    card.appendChild(el("div", { class: "btn-row" }, [again, " ", pick, " ", flash, " ", tips, " ", done]));
    app.appendChild(card);
  }

  // Fire-and-forget: an unsent practice log isn't
  // worth queueing or retrying. Skipped when the drill is anonymous, since
  // an unnamed row tells the weekly report nothing.
  function logPracticeDrill(drill, correct) {
    var id = drill.identity;
    if (!RESULTS_WEBHOOK_URL || (!id.phone && !id.lastName)) return;
    fetch(RESULTS_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        type: "practice",
        timestamp: new Date().toISOString(),
        phone: id.phone || "",
        last_name: id.lastName || "",
        first_name: id.firstName || "",
        recruiter: id.recruiter || "",
        section: drill.code,
        correct: correct,
        total: drill.questions.length
      })
    }).catch(function () {});
  }

  // ---------- Screen: Results ----------
  function renderResults() {
    clear(app);
    setKeyHandler(null);
    armIdleTimeout();
    // Already computed and saved to history in finishSection when the last
    // section ended, so a refresh on the STOP screen in between can't lose it.
    var results = state.finalResults;

    var card = el("div", { class: "card" });
    card.appendChild(el("h1", {}, ["Results"]));
    card.appendChild(el("p", { class: "byline" }, [displayName()]));
    card.appendChild(el("p", { class: "byline" }, [
      "Recruiter: " + formatRecruiterDisplay(state.recruiter) +
      (TEST_VARIANTS.length > 1 ? " · Test " + state.testNumber : "")
    ]));

    var hero = el("div", { class: "hero" });
    hero.appendChild(el("div", { class: "hero-value" }, [String(results.aqft)]));
    hero.appendChild(el("div", { class: "hero-label" }, ["Projected AFQT Score"]));
    hero.appendChild(el("div", { class: "hero-sub" }, [
      "Projected on the full-length ASVAB scale"
    ]));
    card.appendChild(hero);

    var meters = el("div", { class: "meter-list" });
    QUESTIONS.sections.forEach(function (sec) {
      var r = results.byCode[sec.code];
      var name = parseSectionTitle(sec.title).name;
      var band = statusBand(r.pct);

      var track = el("div", { class: "meter-track" });
      track.appendChild(el("div", {
        class: "meter-fill status-fill-" + band.key,
        style: "width:" + r.pct.toFixed(0) + "%"
      }));

      var footBits = [
        el("span", { class: "status-dot status-fill-" + band.key }),
        el("span", {}, [band.label])
      ];
      if (r.unanswered > 0) {
        footBits.push(el("span", { class: "meter-unanswered" }, [r.unanswered + " unanswered"]));
      }

      meters.appendChild(el("div", { class: "meter-row" }, [
        el("div", { class: "meter-head" }, [
          el("div", { class: "meter-name" }, [boldedName(name)]),
          el("div", { class: "meter-frac" }, [r.correct + " / " + r.total])
        ]),
        track,
        el("div", { class: "meter-foot" }, footBits)
      ]));
    });
    card.appendChild(meters);

    var overallStat = el("div", { class: "overall-stat" }, [
      el("div", { class: "overall-stat-value" }, [Math.round(results.overallPct) + "%"]),
      el("div", { class: "overall-stat-label" }, ["Overall"])
    ]);
    card.appendChild(overallStat);

    var readiness = renderReadinessCard();
    if (readiness) card.appendChild(readiness);
    // The recruiter's follow-up codes (save the applicant, text them) go
    // in the recruiter's email instead; this one is for the applicant.
    card.appendChild(renderRecruiterContact());
    if (PRACTICE) card.appendChild(renderPracticeSuggestion(results));
    card.appendChild(renderM2SCard());

    var restartBtn = el("button", { class: "btn" }, ["Start New Test"]);
    restartBtn.addEventListener("click", function () {
      renderStart();
    });
    card.appendChild(el("div", { class: "btn-row" }, [restartBtn]));

    app.appendChild(card);
  }

  // ---------- Boot ----------
  // "?practice" (the link in the applicant text) opens Practice Questions
  // directly when this copy has a practice bank.
  loadData(function () {
    if (PRACTICE && /[?&]practice\b/.test(location.search)) {
      var search = location.search || "";
      var params = {};
      var qs = search.replace(/^\?/, "").split("&");
      qs.forEach(function (pair) {
        var parts = pair.split("=");
        if (parts[0]) {
          params[decodeURIComponent(parts[0].replace(/\+/g, " "))] =
            decodeURIComponent((parts.slice(1).join("=") || "").replace(/\+/g, " "));
        }
      });
      var initIdentity = {};
      if (params.recruiter) {
        initIdentity.recruiter = params.recruiter;
        state.recruiter = params.recruiter;
      }
      if (params.phone) initIdentity.phone = params.phone;
      if (params.last) initIdentity.lastName = params.last;
      if (params.first) initIdentity.firstName = params.first;
      renderPracticeHome(initIdentity, null);
    } else {
      renderStart();
    }
  });

  // This is used as a home-screen app on an iPad -- an edge-swipe "back"
  // gesture (or a stray back button) would otherwise navigate away from
  // the SPA entirely, losing all in-progress test state. There's nothing
  // to go "back" to within this single-page app, so every back attempt is
  // absorbed: a history entry is pushed immediately, and popstate re-pushes
  // one every time, so the trap never runs out and never needs a second
  // back-press to exit (which would just leave the tab open with the old
  // screen still rendered -- exactly what an unattended kiosk needs).
  history.pushState(null, "", location.href);
  window.addEventListener("popstate", function () {
    history.pushState(null, "", location.href);
  });

  // Catch up any results that failed to sync in a previous session (kiosk
  // closed/reloaded while still offline), whenever connectivity returns,
  // and periodically as a safety net in case the "online" event doesn't
  // fire reliably on every network transition.
  if (navigator.onLine) flushPendingSyncQueue();
  window.addEventListener("online", flushPendingSyncQueue);
  setInterval(function () {
    if (navigator.onLine) flushPendingSyncQueue();
  }, PENDING_SYNC_RETRY_MS);
})();

</script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  }
</script>
</body>
